{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShoeDrop{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    {% block extra_head %}{% endblock %}
</head>

<body class="bg-[#fbfbfb] font-sans text-gray-900 antialiased flex flex-col min-h-screen selection:bg-emerald-100 selection:text-brand-dark">

    {% include 'user/_navbar.html' %}

    <main class="flex-1 w-full">
        {% block content %}{% endblock %}
    </main>

    {% include 'user/_footer.html' %}

    {% block extra_body %}{% endblock %}
</body>
</html>
