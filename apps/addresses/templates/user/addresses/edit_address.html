{% extends 'user/base.html' %}

{% block extra_head %}
<title>Edit Address - ShoeDrop</title>
{% endblock %}

{% block content %}
<!-- TOP NAVIGATION BAR -->
    

<!-- MAIN CENTERED CONTAINER -->
    <div class="flex-grow flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8 w-full">
        
        <!-- Max width control for the form card -->
        <main class="w-full max-w-3xl space-y-6 bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm">

            <!-- Breadcrumbs & Header -->
            <div class="border-b border-slate-100 pb-5">
                <nav class="text-[10px] font-bold text-slate-400 tracking-wider uppercase flex items-center gap-1.5 mb-2">
                    <a href="{% url 'address_list' %}" class="hover:text-brand-dark transition-colors">My Address</a>
                    <span>/</span>
                    <span class="text-slate-900">Edit Address</span>
                </nav>
                <h1 class="text-2xl font-black text-slate-950 tracking-tight uppercase">Edit Address</h1>
                <p class="text-xs text-slate-400 font-medium mt-1">Update your delivery address details below.</p>
            </div>

            <!-- Address Edit Input Form -->
            <form method="POST" class="space-y-5">
                {% csrf_token %}
                {% include 'user/_messages.html' %}
                
                <!-- Full Name -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 pl-1">Full Name</label>
                    <input type="text" name="full_name" value="{{ address.full_name }}" required
                        class="w-full px-4 py-3 bg-slate-50/60 border border-slate-200 rounded-xl text-slate-900 text-xs font-semibold placeholder-slate-400 focus:bg-white focus:border-brand-emerald focus:ring-1 focus:ring-brand-emerald outline-none transition-all">
                </div>

                <!-- Mobile & City Row -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 pl-1">Mobile Number</label>
                        <input type="text" name="phone_number" value="{{ address.phone_number }}" required
                            class="w-full px-4 py-3 bg-slate-50/60 border border-slate-200 rounded-xl text-slate-900 text-xs font-semibold placeholder-slate-400 focus:bg-white focus:border-brand-emerald focus:ring-1 focus:ring-brand-emerald outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 pl-1">City</label>
                        <input type="text" name="city" value="{{ address.city }}" required
                            class="w-full px-4 py-3 bg-slate-50/60 border border-slate-200 rounded-xl text-slate-900 text-xs font-semibold placeholder-slate-400 focus:bg-white focus:border-brand-emerald focus:ring-1 focus:ring-brand-emerald outline-none transition-all">
                    </div>
                </div>

                <!-- Pincode, State & Country Row -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 pl-1">Pincode</label>
                        <input type="text" name="postal_code" value="{{ address.postal_code }}" required
                            class="w-full px-4 py-3 bg-slate-50/60 border border-slate-200 rounded-xl text-slate-900 text-xs font-semibold placeholder-slate-400 focus:bg-white focus:border-brand-emerald focus:ring-1 focus:ring-brand-emerald outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 pl-1">State</label>
                        <input type="text" name="state" value="{{ address.state }}" required
                            class="w-full px-4 py-3 bg-slate-50/60 border border-slate-200 rounded-xl text-slate-900 text-xs font-semibold placeholder-slate-400 focus:bg-white focus:border-brand-emerald focus:ring-1 focus:ring-brand-emerald outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 pl-1">Country</label>
                        <input type="text" name="country" value="{{ address.country }}" required
                            class="w-full px-4 py-3 bg-slate-50/60 border border-slate-200 rounded-xl text-slate-900 text-xs font-semibold placeholder-slate-400 focus:bg-white focus:border-brand-emerald focus:ring-1 focus:ring-brand-emerald outline-none transition-all">
                    </div>
                </div>

                <!-- Area Address TextArea -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 pl-1">Address (House No, Building, Street, Area)</label>
                    <textarea rows="3" name="address" required
                        class="w-full px-4 py-3 bg-slate-50/60 border border-slate-200 rounded-xl text-slate-900 text-xs font-semibold placeholder-slate-400 focus:bg-white focus:border-brand-emerald focus:ring-1 focus:ring-brand-emerald outline-none transition-all">{{ address.address }}</textarea>
                </div>

                <!-- Address Type Multi-Button Select Option -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 pl-1">
                        Address Type
                    </label>

                    <div class="grid grid-cols-3 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="address_type" value="HOME" class="hidden peer" {% if address.address_type == 'HOME' %}checked{% endif %}>
                            <div class="bg-white border border-slate-200 text-slate-700 py-3 px-4 rounded-xl text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 peer-checked:bg-brand-dark peer-checked:text-white peer-checked:border-brand-dark peer-checked:shadow-sm transition-all">
                                <span>🏠</span> Home
                            </div>
                        </label>

                        <label class="cursor-pointer">
                            <input type="radio" name="address_type" value="WORK" class="hidden peer" {% if address.address_type == 'WORK' %}checked{% endif %}>
                            <div class="bg-white border border-slate-200 text-slate-700 py-3 px-4 rounded-xl text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 peer-checked:bg-brand-dark peer-checked:text-white peer-checked:border-brand-dark peer-checked:shadow-sm transition-all">
                                <span>💼</span> Work
                            </div>
                        </label>

                        <label class="cursor-pointer">
                            <input type="radio" name="address_type" value="OTHER" class="hidden peer" {% if address.address_type == 'OTHER' %}checked{% endif %}>
                            <div class="bg-white border border-slate-200 text-slate-700 py-3 px-4 rounded-xl text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 peer-checked:bg-brand-dark peer-checked:text-white peer-checked:border-brand-dark peer-checked:shadow-sm transition-all">
                                <span>•••</span> Other
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Set as Default Address Checkbox -->
                <div class="flex items-center pt-1">
                    <label class="inline-flex items-center cursor-pointer select-none">
                        <input type="checkbox" name="is_default" class="rounded border-slate-300 text-brand-dark focus:ring-brand-emerald w-4 h-4 accent-brand-dark" {% if address.is_default %}checked{% endif %}>
                        <span class="ml-2.5 text-[10px] font-bold uppercase tracking-wider text-slate-700">
                            Set as default address
                        </span>
                    </label>
                </div>

                <!-- Form Submissions Trigger Controls -->
                <div class="flex items-center justify-between pt-6 border-t border-slate-100">
                    <a href="{% url 'address_list' %}"
                        class="text-[11px] font-bold uppercase tracking-widest text-slate-400 hover:text-brand-dark transition-colors">
                        Cancel
                    </a>
                    <button type="submit"
                        class="bg-brand-dark hover:bg-brand-darker text-white text-xs font-bold tracking-widest uppercase px-8 py-3.5 rounded-xl shadow-md shadow-brand-dark/15 active:scale-[0.99] transition-all">
                        Save Address
                    </button>
                </div>

            </form>
        </main>
    </div>
{% endblock %}
